name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Build Cordova APK
        run: |
          npm install -g cordova
          cordova create app com.company.smssender SmsSender
          find . -maxdepth 2 -name "index.html" -not -path "./app/*" -exec cp {} app/www/index.html \;
          cd app
          npm install cordova-android@13.0.0 cordova-sms-plugin
          npx cordova platform add android@13.0.0
          npx cordova plugin add cordova-sms-plugin
          npx cordova plugin add cordova-plugin-androidx-adapter
          echo "android.useAndroidX=true" >> platforms/android/gradle.properties
          echo "android.enableJetifier=true" >> platforms/android/gradle.properties
          npx cordova build android --debug
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SmsSender-APK
          path: app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
