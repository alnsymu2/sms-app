name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '7.6.4'

      - name: Build Cordova APK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2"
          npm install -g cordova
          cordova create app com.company.smssender SmsSender
          
          find . -maxdepth 2 -name "index.html" -not -path "./app/*" -exec cp {} app/www/index.html \;
          sed -i 's/accept="[^"]*"//g' app/www/index.html
          
          curl -L https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js -o app/www/xlsx.full.min.js
          sed -i 's|https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js|xlsx.full.min.js|g' app/www/index.html
          
          cd app
          cordova platform add android@12.0.1
          cordova plugin add cordova-sms-plugin
          cordova plugin add cordova-plugin-androidx-adapter
          
          sed -i '/<\/manifest>/i <uses-permission android:name="android.permission.SEND_SMS" />\n<uses-permission android:name="android.permission.READ_PHONE_STATE" />' platforms/android/app/src/main/AndroidManifest.xml
          
          echo "android.useAndroidX=true" >> platforms/android/gradle.properties
          echo "android.enableJetifier=true" >> platforms/android/gradle.properties
          cordova build android --debug
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SmsSender-APK
          path: app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
